syntax = "proto3";
package cluster;

option go_package = "./;cluster";


message /*1*/ N2MOnHandshake {
    string                      ID                          = 1;
    string                      Name                        = 2;
    bool                        Frontend                    = 3;
}

message /*2*/ N2MOnSessionBind {
    string                      SessionID                   = 1;
    string                      UID                         = 2;
    map<string, string>         Servers                     = 3;
}

message /*3*/ N2MOnSessionDisconnected {
    string                      SessionID                   = 1;
}

message /*4*/ N2MOnPush {
    repeated string             SessionID                   = 1;
    bytes                       Plyload                     = 2;
    int32                       MsgID                       = 3;
}
