syntax = "proto3";
package cluster;

option go_package = "./;cluster";


message /*1*/ N2MSend {
    string                      SessionID                   = 1;
    int32                       MsgID                       = 2;
    bytes                       Plyload                     = 3;
}

message /*2*/ N2MOnConnection {
    string                      ID                          = 1;
    string                      Name                        = 2;
    bool                        Frontend                    = 3;
}
message /*3*/ M2NOnConnection {
    string                      ID                          = 1;
    string                      Name                        = 2;
    bool                        Frontend                    = 3;
}

message /*4*/ N2MOnSessionBindServer {
    string                      SessionID                   = 1;
    int64                       UID                         = 2;
    map<string, string>         Servers                     = 3;
}

message /*5*/ N2MOnSessionClose {
    string                      SessionID                   = 1;
}
